# stackforge.iquee.tech
#
# Cloudflare SSL/TLS mode: Full
# - Visitors use HTTPS to Cloudflare.
# - Cloudflare connects to this origin over HTTPS (port 443).
# - Full encrypts that hop and does not require a publicly trusted origin
#   certificate. A Cloudflare Origin CA certificate, or the self-signed cert
#   from deploy/scripts/generate-origin-cert.sh, is enough.
# - Keep the cert and key on the VPS at deploy/certs/origin.crt and origin.key.
#   Do not commit them.
# - After the origin certificate is one Cloudflare trusts (Origin CA), switch
#   the dashboard mode to Full (strict) and leave "Always Use HTTPS" on.
# - Flexible mode would send cleartext from Cloudflare to this origin. This
#   vhost expects the Full connection on 443.
#
# Real visitor IPs: ranges below were copied from
# https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
# on 2026-09-30. Refresh them if Cloudflare publishes new ranges.
# Only those sources may set CF-Connecting-IP, so a client that bypasses
# Cloudflare cannot spoof the header.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_vary on;

server_tokens off;

# Docker's embedded DNS. Re-resolve "app" so a recreated container is picked up
# without an nginx reload. ipv6 is off because the compose network is IPv4.
resolver 127.0.0.11 valid=10s ipv6=off;

# Unknown HTTPS hosts get a closed connection. Port 80 is this site's
# default listener so a healthcheck against the container IP (Host
# 127.0.0.1, no SNI) still reaches /health.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    return 444;
}

server {
    listen 80 default_server;
    server_name stackforge.iquee.tech;

    location = /health {
        access_log off;
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # Requires nginx >= 1.25.1. The compose image is nginx:1.27-alpine.
    http2 on;
    server_name stackforge.iquee.tech;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 25m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health {
        access_log off;
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
    }

    location / {
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        # Next.js streams RSC payloads; do not buffer them to completion.
        proxy_buffering off;
    }
}
